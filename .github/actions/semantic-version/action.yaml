name: Semantic Version
description: Get and update project version
inputs:
  project-path:
    description: Path to project directory
    required: true
    default: '.'
  setup-java:
    description: Whether to setup Java SDK
    default: 'false'
outputs:
  current-version:
    description: Current project version
    value: 0.1.2
  next-major-version:
    description: Next major version
    value: 1.0.0
  next-minor-version:
    description: Next minor version
    value: 0.2.0
  next-patch-version:
    description: Next patch version
    value: 0.1.3

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Setup Java JDK
      if: ${{ inputs.setup-java == 'true' }}
      uses: actions/setup-java@v6.0.1
      with:
        java-version: 17
        distribution: temurin
        cache: maven
        cache-dependency-path: ${{ inputs.project-path }}/pom.xml
