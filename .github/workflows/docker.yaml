name: Docker
on:
  workflow_call:
    inputs:
      project-path:
        description: Path to project directory
        required: true
        type: string
        default: '.'
      project-version:
        description: Current project version
        required: true
        type: string
      release-version:
        description: Whether to use release version
        type: boolean
      build-artifact-id:
        description: Build artifact ID
        type: string
      container-registry:
        description: Container registry
        required: true
        type: string
      container-registry-username:
        description: Container registry username
        required: true
        type: string
      image-name:
        description: Docker image name
        required: true
        type: string
      upload-image:
        description: Whether to upload Docker image
        type: boolean
    secrets:
      container-registry-password:
        description: Container registry password
        required: true
permissions:
  contents: read
  packages: write

jobs:
  docker-build-push:
    name: Docker Build Push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download artifact
        if: ${{ inputs.build-artifact-id != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ inputs.build-artifact-id }}
          path: ${{ inputs.project-path }}
      - name: Login to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ inputs.container-registry }}
          username: ${{ inputs.container-registry-username }}
          password: ${{ secrets.container-registry-password }}
      - name: Extract metadata for Docker
        id: docker-metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ inputs.image-name }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=${{ inputs.project-version }}-,enable=${{ !inputs.release-version }}
            type=raw,value=${{ inputs.project-version }},enable=${{ inputs.release-version }}
            type=raw,value=latest,enable=${{ inputs.release-version }}
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.project-path }}
          push: ${{ inputs.upload-image }}
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          build-args: |
            SERVICE_PORT=${{ vars.SERVICE_PORT }}
