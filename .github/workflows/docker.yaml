name: Docker
run-name: Build and push Docker image at ${{ inputs.project-path }}
on:
  workflow_call:
    inputs: &workflow_call_inputs
      project-path:
        description: Path to the project directory
        required: true
        type: string
      build-artifact-id:
        description: Artifact ID of Project build
        type: string
      image-name:
        description: Name of Docker image
        required: true
        type: string
      project-version:
        description: Current project version
        required: true
        type: string
      upload-image:
        description: Whether to upload the Docker image
        type: boolean
  workflow_dispatch:
    inputs: *workflow_call_inputs
permissions:
  contents: read
  packages: write

jobs:
  docker-build-push:
    name: Docker Build and Push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download artifact
        if: ${{ inputs.build-artifact-id != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ inputs.build-artifact-id }}
          path: ${{ inputs.project-path }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: docker-metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ inputs.image-name }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=${{ inputs.project-version }}-,enable=true
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.project-path }}
          push: ${{ inputs.upload-image }}
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          build-args: |
            SERVICE_PORT=${{ vars.SERVICE_PORT }}
